    type: numeric
    aliases:
      - Treated
      - people_managed
      - '#lfdmdi_tot'
    range: [0, 500000]
  households_managed:
    required: false
    type: numeric
    aliases:
      - '#lfdmdi_hh_tot'
    range: [0, 500000]
  surgeries_done:
    required: false
    type: numeric
    aliases:
      - '#lfdmdi_sx_tot'
    range: [0, 50000]
  surgeries_achieved_pct:
    required: false
    type: numeric
    aliases:
      - '#lfdmdi_sx_achieved'
    range: [0, 2]

# Built 2026-08-27 against the real CMR field codes (#lfdmdi_* prefix) and real
# ADMIN1/ADMIN2 names (from the corrected "...Template_July_updated08272026.xlsx"
# workbook's "ALL Admin Levels" reference sheet), via read-only recon (structure/
# admin-unit names only -- no MMDP counts read or persisted) against the real HTI
# 2026 July submission. Numeric ranges are generic placeholders sized to Ethiopia's
# LF MMDP schema (same program, same field shape), NOT fitted to a real Haiti max,
# since count columns weren't read this pass -- tighten once a real submission's
# values are reviewed (same caveat as bra/ven's schemas).

country: ht
disease: lf
data_source: programmatic
data_type: mmdp
version: '1.0'
description: Haiti lf morbidity management and disability prevention (MMDP), 'LF
  MMDP' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: year
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#lfdmdi_year'
    range: [1990, 2035]
  department:
    required: false
    type: character
    aliases:
      - Department
      - Region
      - adm1
      - '#lfdmdi_adm1'
    allowed_values:
      - Artibonite
      - Centre
      - Grande'Anse
      - Nippes
      - North
      - North-East
      - North-West
      - South
      - South-East
      - West
  district:
    required: true
    type: character
    aliases:
      - District
      - Commune
      - district_name
      - adm2
      - '#lfdmdi_adm2'

# Built 2026-07-16 against the REAL CMR field codes (#rbtrt_* prefix), via read-only
# recon (structure/aggregate counts only, no records persisted or shared) against the
# real 202605 submission from Ethiopia.

country: eth
disease: oncho
data_source: programmatic
data_type: treatment
version: '1.0'
description: Ethiopia oncho MDA coverage, 'RB Treatment' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: treatment_round
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#rbtrt_year'
    range: [1990, 2035]
  region:
    required: false
    type: character
    aliases:
      - Region
      - adm1
      - '#rbtrt_adm1'
  district:
    required: true
    type: character
    aliases:
      - District
      - district_name
      - adm2
      - '#rbtrt_adm2'
    allowed_values:
      - Agnua
      - Ari
      - Awi
      - Bale
      - Basketo SpW
      - Bench Sheko
      - Buno Bedele
      - Central Gondar
      - Dawuro
      - East Arsi
      - East Bale
      - East Hararge
      - Gofa
      - Gurage
      - Hadiya
      - Illubabor
      - Itang SpW
      - Jimma
      - Kaffa
      - Konta Special
      - Liban
      - Metekel
      - Mezheng
      - North Gojam
      - North Shoa
      - Sheka
      - South Gondar
      - South Omo
      - South West Shoa
      - South Wollo
      - Tambaro SpW
      - West Gojjam
      - West Gondar
      - West Guji
      - West Hararge
      - West Omo
      - Wolayita
      - WTH
      - Yem
  sub_county:
    required: false
    type: character
    aliases:
      - SubCounty
      - sub_county
      - adm3
      - '#rbtrt_adm3'
  disease_reported:
    required: false
    type: character
    aliases:
      - '#rbtrt_disease'
  program_status:
    required: false
    type: character
    aliases:
      - program_status
      - '#rbtrt_programstatus'
    allowed_values:
      - Transmission ongoing
      - Transmission suppressed
      - Transmission suspected interrupted
      - PTS Failed
      - Transmission interrupted
      - Transmission eliminated
  population:
    required: false
    type: numeric
    aliases:
      - Population
      - '#rbtrt_pop'
    range: [0, 775490]
  treatment_round:
    required: false
    type: numeric
    aliases:
      - Round
      - MDA_round
      - treatment_round
      - '#rbtrt_trtrd'
    range: [0, 10]
    # If a real treatment goal is reported (target_pop > 0), the round must be
    # a real MDA frequency -- annual/biannual/quarterly -- not an arbitrary
    # sequential count. Reported by Emalee, 2026-08-27 (relayed by Nishant);
    # issue #335.
    allowed_values: [1, 2, 4]
    allowed_values_when:
      column: target_pop
      op: ">"
      value: 0
  target_pop:
    required: false
    type: numeric
    aliases:
      - TargetPop
      - target_population
      - eligible_pop
      - '#rbtrt_trttarget'
    # Whether a target_pop of 0 is a flag or expected depends on program_status:
    # once transmission is interrupted/eliminated, a genuinely zero target is
    # correct, not a data error (reported by Emalee, 2026-07-29, real ETH
    # 202606 data -- e.g. "Transmission interrupted" rows with target_pop = 0).
    # The base `range` below is the pre-existing bound, kept as a fallback for
    # a program_status this schema can't recognize (missing/blank/unexpected
    # value) -- so those rows still get today's coverage rather than going
    # completely unchecked.
    range: [1, 1302823]
    range_overrides:
      # Checked FIRST, ahead of program_status below: a round of 0 means no
      # MDA round happened this period at all, so a real target for it is a
      # contradiction regardless of the program's overall transmission status
      # -- even an "ongoing" program legitimately reports 0 for a round that
      # hasn't started yet this period. Reported by Hannah (eri_feedback #13,
      # 2026-08-13, "for all countries"); issue #335.
      - when:
          column: treatment_round
          op: "=="
          value: 0
        range: [0, 0]
      - when:
          column: program_status
          op: in
          value: [Transmission ongoing, Transmission suppressed,
                  Transmission suspected interrupted, PTS Failed]
        range: [1, 1302823]
      - when:
          column: program_status
          op: in
          value: [Transmission interrupted, Transmission eliminated]
        range: [0, 0]
  village_target:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_villagetarget'
    range: [0, 5000]
  male_treated:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_male_tot'
    range: [0, 950016]
  female_treated:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_fem_tot'
    range: [0, 950016]
  treated:
    required: true
    type: numeric
    aliases:
      - Treated
      - people_treated
      - '#rbtrt_tot'
    range: [0, 950016]
  coverage_pct:
    required: false
    type: numeric
    aliases:
      - CoveragePct
      - coverage
      - '#rbtrt_coverage'
    range: [0, 150]
consistency:
  implausible_overcoverage:
    lhs: treated
    op: <=
    rhs: target_pop
    message: treated exceeds target_pop (over 100% raw coverage)
  treated_nonneg:
    lhs: treated
    op: '>='
    rhs_value: 0.0
    message: Negative treated count


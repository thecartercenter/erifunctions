# Built 2026-07-23 against the real CMR field codes (#rb_epi_surv_* prefix) and real
# ADMIN1/ADMIN2 names, via read-only recon (admin-unit names only) against the real
# VEN 2026 June submission. Scoped to the identifier spine only (year/focus/district/
# sub_district), matching eth/sdn/ssd's precedent for this sheet shape: monthly-wide
# survey-result blocks with no single annual roll-up column to validate a range against.

country: ven
disease: oncho
data_source: programmatic
data_type: prevalence
version: '1.0'
description: Venezuela (OEPA) oncho prevalence surveys, 'RB Epi Surveys' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: year
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#rb_epi_surv_year'
    range: [1990, 2035]
  focus:
    required: false
    type: character
    aliases:
      - Focus
      - Region
      - adm1
      - '#rb_epi_surv_adm1'
  district:
    required: true
    type: character
    aliases:
      - District
      - district_name
      - adm2
      - '#rb_epi_surv_adm2'
    allowed_values:
      - Caura
      - Chalbaud
      - Guaharibos
      - Mavaca
      - Ocamo
      - Orinoquito
      - Padamo
      - Parima
      - Platanal
      - Siapa
      - Uasadi
      - Ventuari
  sub_district:
    required: false
    type: character
    aliases:
      - SubDistrict
      - sub_district
      - adm3
      - '#rb_epi_surv_adm3'
  disease_reported:
    required: false
    type: character
    aliases:
      - '#rb_epi_surv_disease'
  otz:
    required: false
    type: character
    aliases:
      - '#rb_epi_surv_otz'

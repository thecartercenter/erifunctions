# Cross-sheet DQ check (ADR-0024), Ethiopia's treatment_implies_training
# (eth.yaml) extended to Madagascar in issue #373. Madagascar has LF treatment
# only ("Traitement FL"; no RB tab, so no rb_lf_pop_match). Its CDD, CS and
# health-worker training tabs are French-named: "Formation Distributeurs",
# "Formation SC" and "Formation Travailleurs de Sante". Checked against
# Madagascar's 202609 CMR (structure only).
cross_consistency:
  treatment_implies_training:
    description: >
      If a district's LF treated total is > 0, its CDD+CS+health-worker
      training total must also be > 0 (and conversely, both must be 0
      together).
      Skipped only when none of those training sheets is in the
      workbook this period. A sheet that is present with no rows counts as
      zero training, so the treated districts are flagged; a district listed
      with an empty training total is not checked.
    join_key: district
    lhs:
      agg: sum
      missing_as: 0
      sources:
        - {disease: lf, data_type: treatment, column: treated}
    rhs:
      agg: sum
      missing_as: 0
      sources:
        - {disease: rblf, data_type: training, column: tot,
          sheets: ["Formation Distributeurs", "Formation SC", "Formation Travailleurs de Sante"]}
    op: same_sign
    message: "treatment and training activity disagree on whether this district had any activity this period"

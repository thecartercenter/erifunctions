# Cross-check (issue #374): male_trained + female_trained (the annual totals) should equal the
# sum of every monthly new + refresher column above. Same rule Ethiopia's training schema carries
# (R/dq.R's add_anomaly_consistency() lhs_sum/rhs_sum). If a sheet's columns don't match, the rule is
# skipped and eri_cmr_dq_report() says so (it does NOT read as a pass).
consistency:
  gender_sum_matches_type_sum:
    lhs_sum: [male_trained, female_trained]
    op: "=="
    rhs_sum:
      - new_male_jan
      - new_male_feb
      - new_male_mar
      - new_male_apr
      - new_male_may
      - new_male_jun
      - new_male_jul
      - new_male_aug
      - new_male_sep
      - new_male_oct
      - new_male_nov
      - new_male_dec
      - new_fem_jan
      - new_fem_feb
      - new_fem_mar
      - new_fem_apr
      - new_fem_may
      - new_fem_jun
      - new_fem_jul
      - new_fem_aug
      - new_fem_sep
      - new_fem_oct
      - new_fem_nov
      - new_fem_dec
      - refresh_male_jan
      - refresh_male_feb
      - refresh_male_mar
      - refresh_male_apr
      - refresh_male_may
      - refresh_male_jun
      - refresh_male_jul
      - refresh_male_aug
      - refresh_male_sep
      - refresh_male_oct
      - refresh_male_nov
      - refresh_male_dec
      - refresh_fem_jan
      - refresh_fem_feb
      - refresh_fem_mar
      - refresh_fem_apr
      - refresh_fem_may
      - refresh_fem_jun
      - refresh_fem_jul
      - refresh_fem_aug
      - refresh_fem_sep
      - refresh_fem_oct
      - refresh_fem_nov
      - refresh_fem_dec
    message: "Sum of male+female trained does not equal sum of new+refresher trained (monthly)"

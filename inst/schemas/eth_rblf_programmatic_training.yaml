# Cross-check (issue #334): the sum of male_trained + female_trained (the annual,
# already-captured totals) should equal the sum of every monthly new + refresher
# column above. Reported by Emalee (relayed by Nishant, 2026-08-27): "We've seen
# mismatches here in the Ethiopia data." Uses the lhs_sum/rhs_sum consistency
# capability (R/dq.R's add_anomaly_consistency()) added for this check -- the
# engine's single-lhs/single-rhs consistency: block can't express "sum of many
# columns vs sum of many other columns" on its own.
#
# Applies only to the 5 training types with a monthly new/refresher-by-gender
# breakdown (CDD/CS/HW use a different layout and are covered by
# monthly_gender_sum_matches_type_sum below, issue #374); a
# row from "ToT Regional"/"ToT Zonal" (no such columns at all) has every rhs_sum
# column absent/NA, so add_anomaly_consistency()'s "row where every column on a
# summed side is NA stays NA, not fabricated as 0" rule correctly skips it rather
# than flagging every ToT row as a false mismatch.
consistency:
  gender_sum_matches_type_sum:
    skip_ok: true   # by-gender layout only; skipping on the other sheets is by design
    lhs_sum: [male_trained, female_trained]
    op: "=="
    rhs_sum:
      - new_male_jan
      - new_male_feb
      - new_male_mar
      - new_male_apr
      - new_male_may
      - new_male_jun
      - new_male_jul
      - new_male_aug
      - new_male_sep
      - new_male_oct
      - new_male_nov
      - new_male_dec
      - new_fem_jan
      - new_fem_feb
      - new_fem_mar
      - new_fem_apr
      - new_fem_may
      - new_fem_jun
      - new_fem_jul
      - new_fem_aug
      - new_fem_sep
      - new_fem_oct
      - new_fem_nov
      - new_fem_dec
      - refresh_male_jan
      - refresh_male_feb
      - refresh_male_mar
      - refresh_male_apr
      - refresh_male_may
      - refresh_male_jun
      - refresh_male_jul
      - refresh_male_aug
      - refresh_male_sep
      - refresh_male_oct
      - refresh_male_nov
      - refresh_male_dec
      - refresh_fem_jan
      - refresh_fem_feb
      - refresh_fem_mar
      - refresh_fem_apr
      - refresh_fem_may
      - refresh_fem_jun
      - refresh_fem_jul
      - refresh_fem_aug
      - refresh_fem_sep
      - refresh_fem_oct
      - refresh_fem_nov
      - refresh_fem_dec
    message: "Sum of male+female trained does not equal sum of new+refresher trained (monthly, MMDP/Field Ento/Hope Group Leader/Lab Training)"

  # Same check as above for the CDD/CS/HW layout (issue #374): every month's
  # male + female trained should equal that month's new + refresher trained.
  monthly_gender_sum_matches_type_sum:
    skip_ok: true   # CDD/CS/HW layout only; skipping on the other sheets is by design
    lhs_sum:
      - trained_male_jan
      - trained_male_feb
      - trained_male_mar
      - trained_male_apr
      - trained_male_may
      - trained_male_jun
      - trained_male_jul
      - trained_male_aug
      - trained_male_sep
      - trained_male_oct
      - trained_male_nov
      - trained_male_dec
      - trained_fem_jan
      - trained_fem_feb
      - trained_fem_mar
      - trained_fem_apr
      - trained_fem_may
      - trained_fem_jun
      - trained_fem_jul
      - trained_fem_aug
      - trained_fem_sep
      - trained_fem_oct
      - trained_fem_nov
      - trained_fem_dec
    op: "=="
    rhs_sum:
      - new_jan
      - new_feb
      - new_mar
      - new_apr
      - new_may
      - new_jun
      - new_jul
      - new_aug
      - new_sep
      - new_oct
      - new_nov
      - new_dec
      - refresh_jan
      - refresh_feb
      - refresh_mar
      - refresh_apr
      - refresh_may
      - refresh_jun
      - refresh_jul
      - refresh_aug
      - refresh_sep
      - refresh_oct
      - refresh_nov
      - refresh_dec
    message: "Sum of male+female trained does not equal sum of new+refresher trained (monthly, CDD/CS/HW Training)"

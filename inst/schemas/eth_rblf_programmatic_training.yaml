    type: numeric
    aliases: ["#cddtrn_new_male_feb", "#cstrn_new_male_feb", "#dmditrnsx_new_male_feb", "#dmditrnpt_new_male_feb", "#entotrn_new_male_feb", "#hgtrn_new_male_feb", "#hwtrn_new_male_feb", "#labtrn_new_male_feb"]
  new_male_mar:
    required: false
    type: numeric
    aliases: ["#cddtrn_new_male_mar", "#cstrn_new_male_mar", "#dmditrnsx_new_male_mar", "#dmditrnpt_new_male_mar", "#entotrn_new_male_mar", "#hgtrn_new_male_mar", "#hwtrn_new_male_mar", "#labtrn_new_male_mar"]
  new_male_apr:

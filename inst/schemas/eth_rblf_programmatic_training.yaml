    type: numeric
    aliases: ["#cddtrn_new_male_apr", "#cstrn_new_male_apr", "#dmditrnsx_new_male_apr", "#dmditrnpt_new_male_apr", "#entotrn_new_male_apr", "#hgtrn_new_male_apr", "#hwtrn_new_male_apr", "#labtrn_new_male_apr"]
  new_male_may:
    required: false
    type: numeric
    aliases: ["#cddtrn_new_male_may", "#cstrn_new_male_may", "#dmditrnsx_new_male_may", "#dmditrnpt_new_male_may", "#entotrn_new_male_may", "#hgtrn_new_male_may", "#hwtrn_new_male_may", "#labtrn_new_male_may"]
  new_male_jun:
    required: false
    type: numeric
    aliases: ["#cddtrn_new_male_jun", "#cstrn_new_male_jun", "#dmditrnsx_new_male_jun", "#dmditrnpt_new_male_jun", "#entotrn_new_male_jun", "#hgtrn_new_male_jun", "#hwtrn_new_male_jun", "#labtrn_new_male_jun"]
  new_male_jul:
    required: false
    type: numeric
    aliases: ["#cddtrn_new_male_jul", "#cstrn_new_male_jul", "#dmditrnsx_new_male_jul", "#dmditrnpt_new_male_jul", "#entotrn_new_male_jul", "#hgtrn_new_male_jul", "#hwtrn_new_male_jul", "#labtrn_new_male_jul"]
  new_male_aug:

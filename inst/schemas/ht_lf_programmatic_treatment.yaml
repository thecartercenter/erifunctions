# Built 2026-08-27 against the real CMR field codes (#lftrt_* prefix) and real
# ADMIN1/ADMIN2 names + dropdown enumerations (from the corrected
# "...Template_July_updated08272026.xlsx" workbook's "ALL Admin Levels"/"Dropdowns"
# reference sheets), via read-only recon (structure/admin-unit names/dropdown
# categories only -- no treatment counts read or persisted) against the real HTI
# 2026 July submission. Numeric ranges are generic placeholders sized to Ethiopia's
# LF schema (same program, same field shape), NOT fitted to a real Haiti max, since
# count columns weren't read this pass -- tighten once a real submission's values
# are reviewed (same caveat as bra/ven's schemas).

country: ht
disease: lf
data_source: programmatic
data_type: treatment
version: '1.0'
description: Haiti lf MDA coverage, 'LF Treatment' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: treatment_round
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#lftrt_year'
    range: [1990, 2035]
  department:
    required: false
    type: character
    aliases:
      - Department
      - Region
      - adm1
      - '#lftrt_adm1'
    allowed_values:
      - Artibonite
      - Centre
      - Grande'Anse
      - Nippes
      - North
      - North-East
      - North-West
      - South
      - South-East
      - West
  district:
    required: true
    type: character
    aliases:
      - District
      - Commune
      - district_name
      - adm2
      - '#lftrt_adm2'
    allowed_values:
      - Abricots
      - Acul du Nord
      - Anse Rouge
      - Anse a Galets
      - Anse-a-Foleur
      - Anse-a-Pitre
      - Anse-a-Veau
      - Anse d'Hainault
      - Aquin
      - Arcahaie
      - Arniquet
      - Arnaud
      - Bahon
      - Baie de Henne
      - Bainet
      - Baraderes
      - Bas Limbe
      - Bassin Bleu
      - Beaumont
      - Belladere
      - Belle Anse
      - Bombardopolis
      - Bonbon
      - Borgne
      - Boucan Carre
      - Cabaret
      - Camp-Perrin
      - Cap-Haitien
      - Capotille
      - Caracol
      - Carice
      - Carrefour
      - Cavaillon
      - Cayes-Jacmel
      - Cerca Carvajal
      - Cerca La Source
      - Chambellan
      - Chamsolme
      - Chantal
      - Chardonnieres
      - Cite Soleil
      - Corail
      - Cornillon / Grand Bois
      - Coteaux
      - Cotes de Fer
      - Croix-Des-Bouquets
      - Dame Marie
      - Delmas
      - Desdunes
      - Dessalines
      - Dondon
      - Ennery
      - Fonds des Negres
      - Fonds-Verrettes
      - Fort-Liberte
      - Ferrier
      - Ganthier
      - Gonaives
      - Grand Gosier
      - Grand-Boucan
      - Grand-Goave
      - Grande Riviere Du Nord
      - Grande Saline
      - Gressier
      - Gros Morne
      - Hinche
      - Ile a Vache
      - Jacmel
      - Jean Rabel
      - Jeremie
      - Kenscoff
      - L'Asile
      - L'Estere
      - La Chapelle
      - La Tortue
      - La Vallee
      - La Victoire
      - Lascahobas
      - Leogane
      - Les Anglais
      - Les Cayes
      - Les Irois
      - Limbe
      - Limonade
      - Maissade
      - Maniche
      - Marigot
      - Marmelade
      - Milot
      - Miragoane
      - Mirebalais
      - Mole Saint Nicolas
      - Mombin Crochu
      - Mont-Organise
      - Moron
      - Ouanaminthe
      - Paillant
      - Perches
      - Pestel
      - Petion-Ville
      - Petit Trou de Nippes
      - Petit-Goave
      - Petite Riviere de Nippes
      - Petite Riviere de l'Artibonite
      - Pignon
      - Pilate
      - Plaine du Nord
      - Plaisance
      - Plaisance du Sud
      - Pointe a Raquette
      - Port-Salut
      - Port-a-Piment
      - Port-au-Prince
      - Port-Margot
      - Port-de-Paix
      - Quartier Morin
      - Ranquitte
      - Roche a Bateau
      - Roseaux
      - Saint Jean du Sud
      - Saint Louis du Sud
      - Saint-Louis du Nord
      - Saint-Marc
      - Saint-Michel de l'Attalaye
      - Saint-Raphael
      - Sainte Suzanne
      - Saut d'Eau
      - Savanette
      - Tabarre
      - Terre Neuve
      - Terrier Rouge
      - Thiotte
      - Thomassique
      - Thomazeau
      - Thomonde
      - Tiburon
      - Torbeck
      - Trou du Nord
      - Vallieres
      - Verrettes
  sub_district:
    required: false
    type: character
    aliases:
      - SubDistrict
      - sub_county
      - adm3
      - '#lftrt_adm3'
  disease_reported:
    required: false
    type: character
    aliases:
      - '#lftrt_disease'
  program_status:
    required: false
    type: character
    aliases:
      - program_status
      - '#lftrt_programstatus'
    allowed_values:
      - MDA Not Started
      - MDA Started
      - Passed EMS
      - Passed TAS1
      - Passed TAS2
      - Passed TAS3
  population:
    required: false
    type: numeric
    aliases:
      - Population
      - '#lftrt_pop'
    range: [0, 500000]
  treatment_round:
    required: false
    type: numeric
    aliases:
      - Round
      - MDA_round
      - treatment_round
      - '#lftrt_trtrd'
    range: [0, 10]
    # If a real treatment goal is reported (target_pop > 0), the round must be
    # a real MDA frequency -- annual/biannual/quarterly -- not an arbitrary
    # sequential count. Reported by Emalee, 2026-08-27 (relayed by Nishant);
    # issue #335.
    allowed_values: [1, 2, 4]
    allowed_values_when:
      column: target_pop
      op: ">"
      value: 0
  target_pop:
    required: false
    type: numeric
    aliases:
      - TargetPop
      - target_population
      - eligible_pop
      - '#lftrt_trttarget'
    range: [1, 500000]
    range_overrides:
      # Checked FIRST, ahead of program_status below: a round of 0 means no
      # MDA round happened this period at all, so a real target for it is a
      # contradiction regardless of program_status. Reported by Hannah
      # (eri_feedback #13, 2026-08-13, "for all countries"); issue #335.
      - when:
          column: treatment_round
          op: "=="
          value: 0
        range: [0, 0]
      - when:
          column: program_status
          op: in
          value: [MDA Not Started, MDA Started, Passed EMS]
        range: [1, 500000]
      - when:
          column: program_status
          op: in
          value: [Passed TAS1, Passed TAS2, Passed TAS3]
        range: [0, 0]
  village_target:
    required: false
    type: numeric
    aliases:
      - '#lftrt_villagetarget'
    range: [0, 5000]
  male_treated:
    required: false
    type: numeric
    aliases:
      - '#lftrt_male_tot'
    range: [0, 500000]
  female_treated:
    required: false
    type: numeric
    aliases:
      - '#lftrt_fem_tot'
    range: [0, 500000]
  treated:
    required: true
    type: numeric
    aliases:
      - Treated
      - people_treated
      - '#lftrt_tot'
    range: [0, 500000]
  coverage_pct:
    required: false
    type: numeric
    aliases:
      - CoveragePct
      - coverage
      - '#lftrt_coverage'
    range: [0, 150]
consistency:
  implausible_overcoverage:
    lhs: treated
    op: <=
    rhs: target_pop
    message: treated exceeds target_pop (over 100% raw coverage)
  treated_nonneg:
    lhs: treated
    op: '>='
    rhs_value: 0.0
    message: Negative treated count

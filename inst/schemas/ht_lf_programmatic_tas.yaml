# Built 2026-08-27 against the real CMR field codes (#lfsurv_* prefix) and real
# ADMIN1/ADMIN2 names (from the corrected "...Template_July_updated08272026.xlsx"
# workbook's "ALL Admin Levels" reference sheet), via read-only recon (structure/
# admin-unit names only -- no survey counts read or persisted) against the real HTI
# 2026 July submission.
#
# Scoped to the identifier spine only (year/department/district/sub_district),
# matching eth/sdn/ssd's precedent for this sheet shape: monthly-wide survey-result
# blocks (#lfsurv_type_jan/#lfsurv_passfail_jan/etc, repeated per month) with no
# single annual roll-up column to validate a range against. The sheet's "LF Survey
# Type"/"LF Outcomes" Dropdowns enumerations are recorded here for reference should
# a future pass add per-month column validation:
#   survey_type: EMS, TAS1, TAS2, TAS3, IIS1, IIS2, IIS3, Other, PES/PVS
#   outcome:     Pass, Fail, "Incomplete / Did not reach sample size",
#                "Other (explain in notes column)"

country: ht
disease: lf
data_source: programmatic
data_type: tas
version: '1.0'
description: Haiti lf tas surveys, 'LF Surveys' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: year
preprocessing:
  - remove_smart_quotes

# Built 2026-07-23 against the real CMR field codes (#rbtrt_* prefix) and real
# ADMIN1/ADMIN2 names, via read-only recon (admin-unit names only -- no
# treatment/population counts read or persisted) against the real BRA 2026 June
# submission. Numeric ranges are generic placeholders (not fitted to a real
# max, unlike eth's/uga's, since count columns weren't read this pass) -- tighten
# once a real submission's values are reviewed.

country: bra
disease: oncho
data_source: programmatic
data_type: treatment
version: '1.0'
description: Brazil (OEPA) oncho MDA coverage, 'RB Treatment' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: treatment_round
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#rbtrt_year'
    range: [1990, 2035]
  focus:
    required: false
    type: character
    aliases:
      - Focus
      - Region
      - adm1
      - '#rbtrt_adm1'
  district:
    required: true
    type: character
    aliases:
      - District
      - district_name
      - adm2
      - '#rbtrt_adm2'
    allowed_values:
      - Alto Catrimani
      - Aracá
      - Auaris
      - Demini
      - Ericó
      - Hakoma
      - Haxiu
      - Kayanau
      - Koherepi
      - Maloca Paapiú
      - Maxapapi
      - Olomai
      - Palimiu
      - Parafuri
      - Surucucu
      - Waharo
      - Waputha
      - Xihupi
      - Xiriana/Arathaú
      - Xiroxiropiu
      - Xitei
  sub_district:
    required: false
    type: character
    aliases:
      - SubDistrict
      - sub_district
      - adm3
      - '#rbtrt_adm3'
  disease_reported:
    required: false
    type: character
    aliases:
      - '#rbtrt_disease'
  population:
    required: false
    type: numeric
    aliases:
      - Population
      - '#rbtrt_pop'
    range: [0, 50000]
  treatment_round:
    required: false
    type: numeric
    aliases:
      - Round
      - MDA_round
      - treatment_round
      - '#rbtrt_trtrd'
    range: [0, 10]
    # If a real treatment goal is reported (target_pop > 0), the round must be
    # a real MDA frequency -- annual/biannual/quarterly -- not an arbitrary
    # sequential count. Reported by Emalee, 2026-08-27 (relayed by Nishant);
    # issue #335.
    allowed_values: [1, 2, 4]
    allowed_values_when:
      column: target_pop
      op: ">"
      value: 0
  target_pop:
    required: false
    type: numeric
    aliases:
      - TargetPop
      - target_population
      - eligible_pop
      - '#rbtrt_trttarget'
    range: [0, 50000]
    # A round of 0 means no MDA round happened this period -- a real target
    # for it is a contradiction, not a legitimate report. Reported by Hannah
    # (eri_feedback #13, 2026-08-13, "for all countries"); issue #335.
    range_overrides:
      - when:
          column: treatment_round
          op: "=="
          value: 0
        range: [0, 0]
  village_target:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_villagetarget'
    range: [0, 200]
  male_treated:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_male_tot'
    range: [0, 50000]
  female_treated:
    required: false
    type: numeric
    aliases:
      - '#rbtrt_fem_tot'
    range: [0, 50000]
  treated:
    required: true
    type: numeric
    aliases:
      - Treated
      - people_treated
      - '#rbtrt_tot'
    range: [0, 50000]
  coverage_pct:
    required: false
    type: numeric
    aliases:
      - CoveragePct
      - coverage
      - '#rbtrt_coverage'
    range: [0, 150]
consistency:
  implausible_overcoverage:
    lhs: treated
    op: <=
    rhs: target_pop
    message: treated exceeds target_pop (over 100% raw coverage)
  treated_nonneg:
    lhs: treated
    op: '>='
    rhs_value: 0.0
    message: Negative treated count

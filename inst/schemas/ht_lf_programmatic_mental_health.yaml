# Built 2026-08-27 against the real CMR field codes and real ADMIN1/ADMIN2 names
# (from the corrected "...Template_July_updated08272026.xlsx" workbook's "ALL Admin
# Levels" reference sheet), via read-only recon (structure/admin-unit names only --
# no counts read or persisted) against the real HTI 2026 July submission.
#
# "Mental Health" is a sheet not seen in any other onboarded country's CMR --
# psychosocial/morbidity support for LF hydrocele/lymphoedema patients (home visits,
# support group meetings), distinct from "LF MMDP"'s surgical/patient-training
# focus. First `mental_health` DQ schema; see inst/registry/data_model.yaml for the
# data_type registration and inst/schemas/cmr/ht.yaml for the sheet-routing note
# (the ORIGINAL "...Template_July.xlsx" had this sheet's field codes wrongly
# copy-pasted from "LF Treatment" -- #lftrt_* instead of #lfmh_* -- this schema is
# built against the CORRECTED file's own #lfmh_* prefix).
#
# Numeric ranges are generic placeholders (no comparable country's schema to size
# against, and count columns weren't read this pass) -- tighten once a real
# submission's values are reviewed.

country: ht
disease: lf
data_source: programmatic
data_type: mental_health
version: '1.0'
description: Haiti lf psychosocial/morbidity support (home visits, support group
  meetings), 'Mental Health' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: year
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#lfmh_year'
    range: [1990, 2035]

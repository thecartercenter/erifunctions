# Built 2026-07-16 against the REAL CMR field codes (#lftrt_* prefix), via read-only
# recon (structure/aggregate counts only, no records persisted or shared) against the
# real 202605 submission from Ethiopia.

country: eth
disease: lf
data_source: programmatic
data_type: treatment
version: '1.0'
description: Ethiopia lf MDA coverage, 'LF Treatment' sheet of the monthly CMR
language: en
time_grain: annual
temporal:
  year_col: year
  period_col: treatment_round
preprocessing:
  - remove_smart_quotes
columns:
  year:
    required: true
    type: numeric
    aliases:
      - Year
      - YEAR
      - '#lftrt_year'
    range: [1990, 2035]
  region:
    required: false
    type: character
    aliases:
      - Region
      - adm1
      - '#lftrt_adm1'
  district:
    required: true
    type: character
    aliases:
      - District
      - district_name
      - adm2
      - '#lftrt_adm2'
    allowed_values:
      - Agnua
      - Ari
      - Awi
      - Bench Sheko
      - Dawuro
      - Gofa
      - Illubabor
      - Itang SpW
      - Konta Special
      - Metekel
      - Mezheng
      - South Gondar
      - South Omo
      - West Gondar
      - West Omo
      - Yem
  sub_county:
    required: false
    type: character
    aliases:
      - SubCounty
      - sub_county
      - adm3
      - '#lftrt_adm3'
  disease_reported:
    required: false
    type: character
    aliases:
      - '#lftrt_disease'
  program_status:
    required: false
    type: character
    aliases:
      - program_status
      - '#lftrt_programstatus'
    allowed_values:
      - MDA Not Started
      - MDA Started
      - Passed EMS
      - Passed TAS1
      - Passed TAS2
      - Passed TAS3
  population:
    required: false
    type: numeric
    aliases:
      - Population
      - '#lftrt_pop'
    range: [0, 500000]
  treatment_round:
    required: false
    type: numeric
    aliases:
      - Round
      - MDA_round
      - treatment_round
      - '#lftrt_trtrd'
    range: [0, 10]
    # If a real treatment goal is reported (target_pop > 0), the round must be
    # a real MDA frequency -- annual/biannual/quarterly -- not an arbitrary
    # sequential count. Reported by Emalee, 2026-08-27 (relayed by Nishant);
    # issue #335.
    allowed_values: [1, 2, 4]
    allowed_values_when:
      column: target_pop
      op: ">"
      value: 0
  target_pop:
    required: false
    type: numeric
    aliases:
      - TargetPop
      - target_population
      - eligible_pop
      - '#lftrt_trttarget'
    # See eth_oncho_programmatic_treatment.yaml's target_pop for the same
    # program_status-conditioned logic (reported by Emalee, 2026-07-29), and
    # for why the base `range` below is kept as a fallback for an unrecognized
    # program_status.
    # NOTE: Emalee's email asked for [1, 1302823] here too (RB's bound), but
    # real ETH 202606 LF target_pop tops out around 125k -- keeping this
    # schema's existing, data-grounded 500000 ceiling (matches `population`'s
    # own range) rather than carrying over what looks like a copy/paste from
    # the RB section.
    range: [1, 500000]
    range_overrides:
      # Checked FIRST, ahead of program_status below: a round of 0 means no
      # MDA round happened this period at all, so a real target for it is a
      # contradiction regardless of program_status. Reported by Hannah
      # (eri_feedback #13, 2026-08-13, "for all countries"); issue #335.
      - when:
          column: treatment_round
          op: "=="
          value: 0
        range: [0, 0]
      - when:
          column: program_status
          op: in
          value: [MDA Not Started, MDA Started, Passed EMS]
        range: [1, 500000]
      - when:
          column: program_status
          op: in
          value: [Passed TAS1, Passed TAS2, Passed TAS3]
        range: [0, 0]
  village_target:
    required: false
    type: numeric
    aliases:
      - '#lftrt_villagetarget'
    range: [0, 5000]
  male_treated:
    required: false
    type: numeric
    aliases:
      - '#lftrt_male_tot'
    range: [0, 500000]
  female_treated:
    required: false
    type: numeric
    aliases:
      - '#lftrt_fem_tot'
    range: [0, 500000]
  treated:
    required: true
    type: numeric
    aliases:
      - Treated
      - people_treated
      - '#lftrt_tot'
    range: [0, 500000]
  coverage_pct:
    required: false
    type: numeric
    aliases:
      - CoveragePct
      - coverage
      - '#lftrt_coverage'
    range: [0, 150]
consistency:
  implausible_overcoverage:
    lhs: treated
    op: <=
    rhs: target_pop
    message: treated exceeds target_pop (over 100% raw coverage)
  treated_nonneg:
    lhs: treated
    op: '>='
    rhs_value: 0.0
    message: Negative treated count

